<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Eventra Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="admin-layout">

  <!-- ══ Sidebar ══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="event-index.html">Eventra</a>
      <small>Admin Dashboard</small>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li>
          <a href="#" class="active">
            <span class="nav-icon">📊</span> Bookings
          </a>
        </li>
        <li>
          <a href="events.html" target="_blank">
            <span class="nav-icon">🎭</span> Events
          </a>
        </li>
        <li>
          <a href="book.html" target="_blank">
            <span class="nav-icon">📝</span> New Booking
          </a>
        </li>
        <li>
          <a href="event-index.html" target="_blank">
            <span class="nav-icon">🌐</span> Public Site
          </a>
        </li>
      </ul>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="user-avatar">A</div>
        <div class="user-info">
          <strong>Admin</strong>
          <span>Eventra CRM</span>
        </div>
        <button class="btn-logout" id="logoutBtn" title="Logout">⏻</button>
      </div>
    </div>
  </aside>

  <!-- ══ Main ══ -->
  <main class="admin-main">

    <!-- Top bar -->
    <div class="admin-topbar">
      <h1>Bookings Overview</h1>
      <div class="admin-topbar-right">
        <span style="font-size:.82rem;color:var(--text-muted)" id="lastUpdated"></span>
        <button class="btn btn-outline btn-sm" id="refreshBtn" title="Refresh">
          🔄 Refresh
        </button>
      </div>
    </div>

    <div class="admin-content">

      <!-- ── Summary Stats ── -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-icon purple">📋</div>
          <div class="stat-info">
            <strong id="statTotal">—</strong>
            <span>Total Bookings</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">✅</div>
          <div class="stat-info">
            <strong id="statConfirmed">—</strong>
            <span>Confirmed</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon mint">🎟️</div>
          <div class="stat-info">
            <strong id="statAttended">—</strong>
            <span>Attended</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon pink">🕐</div>
          <div class="stat-info">
            <strong id="statRegistered">—</strong>
            <span>Registered</span>
          </div>
        </div>
      </div>

      <!-- ── Toolbar ── -->
      <div class="bookings-toolbar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchInput"
                 placeholder="Search by name, email or event…" />
        </div>
        <select class="filter-select" id="filterStatus">
          <option value="">All Statuses</option>
          <option value="Registered">Registered</option>
          <option value="Confirmed">Confirmed</option>
          <option value="Attended">Attended</option>
        </select>
        <button class="btn btn-outline btn-sm" id="clearFilters">Clear</button>
      </div>

      <!-- ── Bookings list ── -->
      <div id="bookingsContainer">
        <!-- Loading, empty, or booking cards rendered here -->
      </div>

    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
<script>
  // ── Auth guard ──
  const _token = localStorage.getItem('eventra_token');
  if (!_token) { location.href = 'admin-login.html'; }

  // Show logged-in username
  const _uname = localStorage.getItem('eventra_username') || 'Admin';
  const _uEl = document.querySelector('.user-info strong');
  if (_uEl) _uEl.textContent = _uname;
  const _avEl = document.querySelector('.user-avatar');
  if (_avEl) _avEl.textContent = _uname[0].toUpperCase();

  // Auth headers helper
  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + localStorage.getItem('eventra_token')
    };
  }

  // Handle expired token
  function handleAuthError(status) {
    if (status === 401 || status === 403) {
      localStorage.removeItem('eventra_token');
      localStorage.removeItem('eventra_username');
      showToast('Session expired. Please log in again.', 'error');
      setTimeout(() => location.href = 'admin-login.html', 1200);
      return true;
    }
    return false;
  }

  // ── State ──
  let allBookings = [];

  // ── Fetch bookings from API ──
  async function fetchBookings() {
    const container = document.getElementById('bookingsContainer');
    container.innerHTML = `
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <p>Loading bookings…</p>
      </div>`;

    try {
      const res  = await fetch(`${API_BASE}/bookings`, { headers: authHeaders() });
      if (handleAuthError(res.status)) return;
      if (!res.ok) throw new Error('Server error');
      const data = await res.json();
      allBookings = data;
      updateStats();
      renderBookings(allBookings);
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <h3 style="color:#be185d">Server not responding</h3>
          <p style="color:#be185d">Could not load bookings. Make sure the backend is running on port 3000.</p>
          <button class="btn btn-outline" style="margin-top:20px" onclick="fetchBookings()">Try Again</button>
        </div>`;
    }
  }

  // ── Update summary stats ──
  function updateStats() {
    document.getElementById('statTotal').textContent     = allBookings.length;
    document.getElementById('statConfirmed').textContent = allBookings.filter(b => b.status === 'Confirmed').length;
    document.getElementById('statAttended').textContent  = allBookings.filter(b => b.status === 'Attended').length;
    document.getElementById('statRegistered').textContent= allBookings.filter(b => b.status === 'Registered').length;
  }

  // ── Render booking cards ──
  function renderBookings(bookings) {
    const container = document.getElementById('bookingsContainer');

    if (!bookings.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <h3>No bookings found</h3>
          <p>Try adjusting your search or filters.</p>
        </div>`;
      return;
    }

    const cards = bookings.map((b, i) => {
      const initials = b.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      const badgeClass = b.status === 'Confirmed' ? 'badge-confirmed'
                        : b.status === 'Attended'  ? 'badge-attended'
                        : 'badge-registered';
      return `
        <div class="booking-card" style="animation-delay:${i * 0.05}s" data-id="${b._id}">
          <div class="booking-card-header">
            <div style="display:flex;align-items:center;gap:0">
              <div class="booking-avatar">${initials}</div>
              <div class="booking-name-info">
                <strong>${escHtml(b.name)}</strong>
                <span>${escHtml(b.email)}</span>
              </div>
            </div>
            <span class="status-badge ${badgeClass}">${b.status}</span>
          </div>

          <div class="booking-card-body">
            <div class="booking-field">
              <span class="field-icon">🎭</span>
              <div><strong>Event:</strong> ${escHtml(b.event)}</div>
            </div>
            <div class="booking-field">
              <span class="field-icon">📅</span>
              <div><strong>Date:</strong> ${formatDate(b.date)}</div>
            </div>
            <div class="booking-field">
              <span class="field-icon">🕐</span>
              <div><strong>Slot:</strong> ${escHtml(b.slot)}</div>
            </div>
            ${b.message ? `
            <div class="booking-field">
              <span class="field-icon">💬</span>
              <div><strong>Note:</strong> ${escHtml(b.message)}</div>
            </div>` : ''}
            <div class="booking-field">
              <span class="field-icon">🗓️</span>
              <div><strong>Booked:</strong> ${new Date(b.createdAt).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</div>
            </div>
          </div>

          <div class="booking-card-footer">
            <select class="status-select" data-id="${b._id}" onchange="updateStatus(this)">
              <option ${b.status==='Registered'?'selected':''}>Registered</option>
              <option ${b.status==='Confirmed' ?'selected':''}>Confirmed</option>
              <option ${b.status==='Attended'  ?'selected':''}>Attended</option>
            </select>
            <button class="btn btn-danger btn-sm" onclick="deleteBooking('${b._id}','${escHtml(b.name)}')">
              🗑 Delete
            </button>
          </div>
        </div>`;
    }).join('');

    container.innerHTML = `<div class="bookings-list">${cards}</div>`;
  }

  // ── Update status via API ──
  async function updateStatus(selectEl) {
    const id     = selectEl.dataset.id;
    const status = selectEl.value;

    try {
      const res = await fetch(`${API_BASE}/update-booking/${id}`, {
        method:  'PUT',
        headers: authHeaders(),
        body:    JSON.stringify({ status })
      });
      if (handleAuthError(res.status)) return;
      if (!res.ok) throw new Error();

      // Update local state
      const booking = allBookings.find(b => b._id === id);
      if (booking) booking.status = status;

      // Update badge without full re-render
      const card = document.querySelector(`.booking-card[data-id="${id}"]`);
      if (card) {
        const badge = card.querySelector('.status-badge');
        badge.className = 'status-badge ' + (
          status === 'Confirmed' ? 'badge-confirmed' :
          status === 'Attended'  ? 'badge-attended'  : 'badge-registered');
        badge.textContent = status;
      }

      updateStats();
      showToast(`Status updated to ${status} ✅`, 'success');
    } catch {
      showToast('Failed to update status. Please try again.', 'error');
    }
  }

  // ── Delete booking via API ──
  async function deleteBooking(id, name) {
    if (!confirm(`Delete booking for "${name}"? This cannot be undone.`)) return;

    try {
      const res = await fetch(`${API_BASE}/delete-booking/${id}`, { method: 'DELETE', headers: authHeaders() });
      if (handleAuthError(res.status)) return;
      if (!res.ok) throw new Error();

      allBookings = allBookings.filter(b => b._id !== id);
      updateStats();
      applyFilters(); // re-render filtered list
      showToast(`Booking for ${name} deleted.`, 'info');
    } catch {
      showToast('Failed to delete booking. Please try again.', 'error');
    }
  }

  // ── Filter / search ──
  function applyFilters() {
    const query  = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('filterStatus').value;

    const filtered = allBookings.filter(b => {
      const matchQuery  = !query  || [b.name, b.email, b.event].some(f => f.toLowerCase().includes(query));
      const matchStatus = !status || b.status === status;
      return matchQuery && matchStatus;
    });

    renderBookings(filtered);
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('filterStatus').addEventListener('change', applyFilters);
  document.getElementById('clearFilters').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterStatus').value = '';
    renderBookings(allBookings);
  });

  // ── Refresh & logout ──
  document.getElementById('refreshBtn').addEventListener('click', fetchBookings);
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('eventra_token');
    localStorage.removeItem('eventra_username');
    location.href = 'admin-login.html';
  });

  // Escape HTML to prevent XSS
  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Init ──
  fetchBookings();
</script>
</body>
</html>
