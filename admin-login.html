<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – Eventra</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Tab switcher ── */
    .auth-tabs {
      display: flex;
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .auth-tab {
      flex: 1; padding: 10px;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: var(--transition);
      color: var(--text-muted); background: transparent;
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--purple-dark);
      box-shadow: var(--shadow-sm);
    }
    /* ── Password strength bar ── */
    .pwd-strength { margin-top: 7px; }
    .pwd-strength-bar {
      height: 4px; border-radius: 2px;
      background: var(--border); overflow: hidden;
    }
    .pwd-strength-fill {
      height: 100%; border-radius: 2px;
      transition: width .3s ease, background .3s ease;
      width: 0;
    }
    .pwd-strength-label {
      font-size: .75rem; margin-top: 4px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <span class="login-logo">Eventra</span>
      <p>Admin Portal — manage your bookings</p>
    </div>

    <!-- Tab switcher -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin"    onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab"        id="tabRegister" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Shared error/success banner -->
    <div class="login-error" id="authError"></div>

    <!-- ══ Sign In Form ══ -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginUsername">Username</label>
        <input type="text" id="loginUsername" class="form-control"
               placeholder="your-username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div style="position:relative">
          <input type="password" id="loginPassword" class="form-control"
                 placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="toggle-pwd" data-target="loginPassword">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn"
              style="width:100%;justify-content:center;font-size:1rem;margin-top:4px">
        Sign In →
      </button>
    </form>

    <!-- ══ Register Form ══ -->
    <form id="registerForm" novalidate style="display:none">
      <div class="form-group">
        <label class="form-label" for="regUsername">Choose a Username <span style="color:var(--pink)">*</span></label>
        <input type="text" id="regUsername" class="form-control"
               placeholder="e.g. sarah_admin" autocomplete="username" />
        <div class="form-error" id="regUsernameError"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="regPassword">Create Password <span style="color:var(--pink)">*</span></label>
        <div style="position:relative">
          <input type="password" id="regPassword" class="form-control"
                 placeholder="Min. 6 characters" autocomplete="new-password"
                 oninput="checkStrength(this.value)" />
          <button type="button" class="toggle-pwd" data-target="regPassword">👁</button>
        </div>
        <div class="pwd-strength">
          <div class="pwd-strength-bar"><div class="pwd-strength-fill" id="strengthFill"></div></div>
          <div class="pwd-strength-label" id="strengthLabel">Enter a password</div>
        </div>
        <div class="form-error" id="regPasswordError"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="regConfirm">Confirm Password <span style="color:var(--pink)">*</span></label>
        <div style="position:relative">
          <input type="password" id="regConfirm" class="form-control"
                 placeholder="Repeat your password" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" data-target="regConfirm">👁</button>
        </div>
        <div class="form-error" id="regConfirmError"></div>
      </div>
      <button type="submit" class="btn btn-primary" id="registerBtn"
              style="width:100%;justify-content:center;font-size:1rem;margin-top:4px">
        Create Account →
      </button>
    </form>

    <p style="text-align:center;margin-top:24px;font-size:.85rem;color:var(--text-muted)">
      <a href="event-index.html" style="color:var(--purple);font-weight:600">← Back to website</a>
    </p>

  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
<script>
  /* ── Style for toggle-pwd buttons (injected inline for self-containment) ── */
  document.querySelectorAll('.toggle-pwd').forEach(btn => {
    Object.assign(btn.style, {
      position:'absolute', right:'12px', top:'50%',
      transform:'translateY(-50%)', background:'none',
      border:'none', color:'var(--text-muted)',
      fontSize:'.95rem', cursor:'pointer'
    });
  });

  // ── Redirect if already logged in ──
  if (localStorage.getItem('eventra_token')) {
    location.href = 'admin-dashboard.html';
  }

  // ── Tab switching ──
  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    document.getElementById('loginForm').style.display    = isLogin ? '' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
    document.getElementById('authError').classList.remove('show');
    document.getElementById('authError').textContent = '';
  }

  // ── Password show/hide ──
  document.querySelectorAll('.toggle-pwd').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = document.getElementById(btn.dataset.target);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });
  });

  // ── Password strength indicator ──
  function checkStrength(val) {
    const fill  = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { pct: '0%',   color: 'var(--border)',  text: 'Enter a password' },
      { pct: '25%',  color: '#f87171',         text: 'Weak' },
      { pct: '50%',  color: '#fb923c',         text: 'Fair' },
      { pct: '75%',  color: 'var(--blue)',     text: 'Good' },
      { pct: '100%', color: 'var(--mint)',     text: 'Strong 💪' },
    ];
    const lvl = val.length === 0 ? levels[0] : levels[Math.min(score, 4)];
    fill.style.width      = lvl.pct;
    fill.style.background = lvl.color;
    label.textContent     = val.length === 0 ? 'Enter a password' : lvl.text;
    label.style.color     = lvl.color === 'var(--border)' ? 'var(--text-muted)' : lvl.color;
  }

  // ── Show auth error ──
  function showAuthError(msg) {
    const el = document.getElementById('authError');
    el.innerHTML = '⚠️ ' + msg;
    el.classList.add('show');
  }

  // ── SIGN IN ──
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('authError').classList.remove('show');

    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn      = document.getElementById('loginBtn');

    if (!username || !password) {
      showAuthError('Please enter your username and password.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;margin-right:8px"></span> Signing in…';

    try {
      const res  = await fetch(`${API_BASE}/login`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.message);

      // Store JWT and username
      localStorage.setItem('eventra_token',    data.token);
      localStorage.setItem('eventra_username', data.username);

      showToast(`Welcome back, ${data.username}! 👋`, 'success');
      setTimeout(() => location.href = 'admin-dashboard.html', 700);
    } catch (err) {
      showAuthError(err.message || 'Server not responding. Make sure the backend is running.');
      btn.disabled = false;
      btn.innerHTML = 'Sign In →';
      document.getElementById('loginPassword').value = '';
    }
  });

  // ── REGISTER ──
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('authError').classList.remove('show');

    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm  = document.getElementById('regConfirm').value;
    const btn      = document.getElementById('registerBtn');

    // Client-side validation
    let valid = true;
    const setErr = (id, msg) => {
      const el = document.getElementById(id);
      el.textContent = msg; el.classList.toggle('show', !!msg);
    };

    setErr('regUsernameError', '');
    setErr('regPasswordError', '');
    setErr('regConfirmError',  '');

    if (username.length < 3) { setErr('regUsernameError', 'Username must be at least 3 characters.'); valid = false; }
    if (password.length < 6) { setErr('regPasswordError', 'Password must be at least 6 characters.'); valid = false; }
    if (password !== confirm) { setErr('regConfirmError', 'Passwords do not match.'); valid = false; }
    if (!valid) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;margin-right:8px"></span> Creating account…';

    try {
      const res  = await fetch(`${API_BASE}/register`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.message);

      // Auto-login after registration
      localStorage.setItem('eventra_token',    data.token);
      localStorage.setItem('eventra_username', data.username);

      showToast(`Account created! Welcome, ${data.username} 🎉`, 'success');
      setTimeout(() => location.href = 'admin-dashboard.html', 800);
    } catch (err) {
      showAuthError(err.message || 'Registration failed. Please try again.');
      btn.disabled = false;
      btn.innerHTML = 'Create Account →';
    }
  });
</script>
</body>
</html>
